[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invarirank"
version = "0.1.0"
description = "Position-invariant listwise reranking for LLM-based recommendation."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.3",
    "tqdm>=4.66",
    "transformers>=4.45",
]

[project.optional-dependencies]
train = [
    "accelerate>=0.33",
    "peft>=0.12",
]
experiments = [
    "implicit>=0.7",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scipy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["invarirank*"]
